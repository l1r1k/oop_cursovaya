<div class="modal active" id="identityModal" style="z-index:4000;" aria-modal="true" role="dialog">
    <div class="modal-content" style="max-width: 520px;">
        <button type="button" class="modal-close" id="identityModalCloseBtn" aria-label="Закрыть">✕</button>
        <h2 id="identityModalTitle" style="margin-bottom: 1rem;">Подтверждение личности</h2>
        <p id="identityModalHint" style="margin-bottom: 1rem; color: var(--text-light);"></p>

        <div id="identityStepEmail">
            <label for="identityEmail">Электронная почта</label>
            <input type="email" id="identityEmail" required
                   placeholder="Укажите email, который использовали при оформлении заказа"
                   style="width:100%;padding:.75rem;border:2px solid var(--border);border-radius:8px;margin:.5rem 0 1rem;">
            <button type="button" class="btn btn-primary" id="identityEmailBtn" style="width:100%">Продолжить</button>
        </div>

        <div id="identityStepCode" style="display:none;">
            <label for="identityCode">Код из письма</label>
            <input type="text" id="identityCode" inputmode="numeric" maxlength="6" required
                   placeholder="000000"
                   style="width:100%;padding:.75rem;border:2px solid var(--border);border-radius:8px;margin:.5rem 0 1rem;">
            <button type="button" class="btn btn-primary" id="identityCodeBtn" style="width:100%">Подтвердить</button>
            <button type="button" class="btn btn-outline" id="identityBackToEmailBtn" style="width:100%;margin-top:.5rem;">Изменить email</button>
        </div>

        <form id="identityRegisterForm" style="display:none;">
            <div style="margin-bottom:1rem">
                <label for="identityLastName">Фамилия *</label>
                <input type="text" id="identityLastName" name="last_name" required
                       style="width:100%;padding:.75rem;border:2px solid var(--border);border-radius:8px">
            </div>
            <div style="margin-bottom:1rem">
                <label for="identityFirstName">Имя *</label>
                <input type="text" id="identityFirstName" name="first_name" required
                       style="width:100%;padding:.75rem;border:2px solid var(--border);border-radius:8px">
            </div>
            <div style="margin-bottom:1rem">
                <label for="identityMiddleName">Отчество</label>
                <input type="text" id="identityMiddleName" name="middle_name"
                       style="width:100%;padding:.75rem;border:2px solid var(--border);border-radius:8px">
            </div>
            <div style="margin-bottom:1rem">
                <label for="identityPhone">Телефон *</label>
                <input type="tel" id="identityPhone" name="phone_number" required
                       style="width:100%;padding:.75rem;border:2px solid var(--border);border-radius:8px">
            </div>
            <div style="margin-bottom:1rem">
                <label for="identityRegisterEmail">Email *</label>
                <input type="email" id="identityRegisterEmail" name="email" required readonly
                       style="width:100%;padding:.75rem;border:2px solid var(--border);border-radius:8px;background:#f5f5f5">
            </div>
            <span style="display:block;color:var(--text-light);margin-bottom:1rem;">* — обязательные поля</span>
            <div style="display:flex;flex-direction:row;align-items:center;margin-bottom:1rem;gap:1rem;">
                <input type="checkbox" id="identityAgreement" required>
                <p style="text-align:justify;margin:0;">Я подтверждаю согласие на обработку персональных данных</p>
            </div>
            <button type="submit" class="btn btn-primary" id="identityRegisterBtn" style="width:100%">Сохранить и продолжить</button>
            <button type="button" class="btn btn-outline" id="identityRegisterBackBtn" style="width:100%;margin-top:.5rem;">Назад</button>
        </form>

        <p id="identityError" style="display:none;color:var(--accent);margin-top:1rem;"></p>
    </div>
</div>
