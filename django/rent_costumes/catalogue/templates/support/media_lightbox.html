<div class="support-lightbox" id="supportLightbox" style="display:none;" aria-hidden="true">
    <button type="button" class="support-lightbox-close" id="supportLightboxClose" aria-label="Закрыть">✕</button>
    <button type="button" class="support-lightbox-nav support-lightbox-prev" id="supportLightboxPrev" aria-label="Назад">‹</button>
    <img class="support-lightbox-image" id="supportLightboxImage" alt="">
    <button type="button" class="support-lightbox-nav support-lightbox-next" id="supportLightboxNext" aria-label="Вперёд">›</button>
    <div class="support-lightbox-counter" id="supportLightboxCounter"></div>
</div>
