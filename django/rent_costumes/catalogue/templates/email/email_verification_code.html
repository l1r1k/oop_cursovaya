<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #2D1B4E; color: #fff; padding: 24px; text-align: center; border-radius: 8px; }
        .code { font-size: 32px; letter-spacing: 8px; font-weight: bold; text-align: center; margin: 24px 0; color: #2D1B4E; }
        .footer { text-align: center; color: #666; font-size: 14px; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>{{ title }}</h2>
    </div>
    <p>Здравствуйте!</p>
    <p>Для доступа к чату поддержки введите код подтверждения на сайте:</p>
    <p class="code">{{ code }}</p>
    <p>Код действителен 10 минут. Если вы не запрашивали код, проигнорируйте это письмо.</p>
    <div class="footer">
        <p>ГАУК ЯНАО «Окружной Центр национальных культур»</p>
    </div>
</body>
</html>
